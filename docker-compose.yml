# Instância isolada do Mundo Avatar.
#   docker compose up -d --build
# Variáveis opcionais (arquivo .env ao lado deste):
#   MUNDO_AVATAR_PORTA=8080   porta no servidor
#   MAX_ZOOM=6                detalhe máximo do mapa (5 = build mais leve)
services:
  mundo-avatar:
    build:
      context: .
      args:
        MAX_ZOOM: "${MAX_ZOOM:-6}"
    image: mundo-avatar:latest
    container_name: mundo-avatar
    restart: unless-stopped
    ports:
      - "${MUNDO_AVATAR_PORTA:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    networks:
      - mundo-avatar

networks:
  mundo-avatar:
    name: mundo-avatar
