# Servidor estático do Mundo Avatar (porta 8080, sem root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/x-protobuf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # arquivos com hash no nome: podem ficar em cache por muito tempo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # fontes do mapa (glifos .pbf)
    location /fonts/ {
        types { application/x-protobuf pbf; }
        default_type application/octet-stream;
        expires 30d;
        try_files $uri =404;
    }

    # tiles e sobreposições: só mudam quando o mapa é regerado
    location ~ ^/(tiles|overlays|previews)/ {
        expires 7d;
        try_files $uri =404;
    }
    location = /tiles/meta.json {
        expires -1;
    }

    # dados e página: sempre revalidar
    location /data/ {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
