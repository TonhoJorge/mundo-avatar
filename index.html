<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mundo Avatar</title>
    <meta name="description" content="Globo interativo do Mundo Avatar em três eras: Aang, Korra e Pavi e Nisha. Projeto de fã sem fins lucrativos." />
    <meta name="theme-color" content="#2b2118" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235a8fa8' stroke='%233a2a1c' stroke-width='2'/%3E%3Cpath d='M7 15c4-6 9-7 14-4 3 2 4 6 2 9-4 4-11 3-16-5z' fill='%23c9b98a'/%3E%3C/svg%3E" />
  </head>
  <body data-era="aang">
    <main id="mapa" aria-label="Globo do Mundo Avatar" data-i18n-aria="map.aria"></main>

    <header class="topo">
      <div class="busca" role="search">
        <input id="busca" type="search" placeholder="Buscar lugares…" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false"
          role="combobox" aria-label="Buscar lugares" data-i18n-aria="search.placeholder" aria-autocomplete="list" aria-controls="resultados" aria-expanded="false" />
        <ul id="resultados" role="listbox" aria-label="Resultados da busca" data-i18n-aria="search.results" hidden></ul>
      </div>
      <nav id="eras" class="eras" aria-label="Época do mapa" data-i18n-aria="era.nav"></nav>
      <div id="conta" class="conta" hidden></div>
    </header>

    <aside id="painel" class="painel" aria-labelledby="painel-titulo" hidden></aside>

    <div class="ferramentas">
      <button id="btn-era" type="button" class="botao" data-i18n="tools.era">Sobre a era</button>
      <button id="btn-camadas" type="button" class="botao" aria-expanded="false" aria-controls="camadas" data-i18n="tools.layers">Camadas</button>
      <button id="btn-conta" type="button" class="botao" data-i18n="tools.account">Comunidade</button>
      <label class="idioma"><span class="sr" data-i18n="tools.language">Idioma</span><select id="idioma"></select></label>
    </div>
    <section id="camadas" class="camadas" aria-label="Camadas do mapa" data-i18n-aria="tools.layers" hidden>
      <label><input type="checkbox" name="labels" /> <span data-i18n="layers.labels">Nomes dos lugares</span></label>
      <label><input type="checkbox" name="buildings" /> <span data-i18n="layers.buildings">Cidades em 3D</span> <small data-i18n="layers.buildingsHint">(aproxime e incline)</small></label>
      <label><input type="checkbox" name="clouds" /> <span data-i18n="layers.clouds">Nuvens e tempestades</span></label>
      <label><input type="checkbox" name="legacy" /> <span data-i18n="layers.legacy">Lugares do mundo antigo</span> <small data-i18n="layers.legacyHint">(era de Pavi e Nisha)</small></label>
      <label><input type="checkbox" name="editor" /> <span data-i18n="layers.editor">Modo desenvolvedor</span> <small data-i18n="layers.editorHint">(editar e calibrar posições)</small></label>
    </section>

    <div id="coords" class="coords" aria-hidden="true" hidden></div>
    <div id="aviso" class="aviso" role="status" hidden></div>
    <div id="erro" class="erro" role="alert" hidden></div>
    <noscript><div class="erro">Este mapa precisa de JavaScript ativado.</div></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
