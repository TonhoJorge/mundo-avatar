<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mundo Avatar</title>
    <meta name="description" content="Globo interativo do Mundo Avatar em três eras: Aang, Korra e Pavi e Nisha. Projeto de fã sem fins lucrativos." />
    <meta name="theme-color" content="#2b2118" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235a8fa8' stroke='%233a2a1c' stroke-width='2'/%3E%3Cpath d='M7 15c4-6 9-7 14-4 3 2 4 6 2 9-4 4-11 3-16-5z' fill='%23c9b98a'/%3E%3C/svg%3E" />
  </head>
  <body data-era="aang">
    <main id="mapa" aria-label="Globo do Mundo Avatar"></main>

    <header class="topo">
      <div class="busca" role="search">
        <input id="busca" type="search" placeholder="Buscar lugares…" autocomplete="off" spellcheck="false"
          role="combobox" aria-label="Buscar lugares" aria-autocomplete="list" aria-controls="resultados" aria-expanded="false" />
        <ul id="resultados" role="listbox" aria-label="Resultados da busca" hidden></ul>
      </div>
      <nav id="eras" class="eras" aria-label="Época do mapa"></nav>
    </header>

    <aside id="painel" class="painel" aria-labelledby="painel-titulo" hidden></aside>

    <div class="ferramentas">
      <button id="btn-era" type="button" class="botao">Sobre a era</button>
      <button id="btn-camadas" type="button" class="botao" aria-expanded="false" aria-controls="camadas">Camadas</button>
    </div>
    <section id="camadas" class="camadas" aria-label="Camadas do mapa" hidden>
      <label><input type="checkbox" name="labels" /> Nomes dos lugares</label>
      <label><input type="checkbox" name="clouds" /> Nuvens e tempestades</label>
      <label><input type="checkbox" name="legacy" /> Lugares do mundo antigo <small>(era de Pavi e Nisha)</small></label>
      <label><input type="checkbox" name="editor" /> Modo editor <small>(calibrar posições)</small></label>
    </section>

    <div id="coords" class="coords" aria-hidden="true" hidden></div>
    <div id="aviso" class="aviso" role="status" hidden></div>
    <div id="erro" class="erro" role="alert" hidden></div>
    <noscript><div class="erro">Este mapa precisa de JavaScript ativado.</div></noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
